<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level 3 Smoke Test</title>
<style>
  body { font-family: ui-monospace, monospace; background: #0b1020; color: #e2e8f0; padding: 24px; }
  .pass { color: #4ade80; } .fail { color: #f87171; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Level 3 Smoke Test</h1>
<pre id="results">running&#8230;</pre>

<!-- Minimal DOM the modules need (canvas + renderer els + buttons). -->
<canvas id="game-canvas" width="960" height="540"></canvas>
<div id="game-overlay" class="hidden">
  <h4 id="overlay-title"></h4>
  <p id="overlay-text"></p>
  <button id="btn-start"></button>
</div>
<button id="btn-sound"></button>
<button id="btn-pause"></button>
<span id="hud-coins"></span><span id="hud-attempts"></span><span id="hud-best"></span>
<div id="hud-progress"></div>
<span id="level-name-badge"></span>

<script type="module" src="level3_smoke_runner.js"></script>
</body>
</html>
